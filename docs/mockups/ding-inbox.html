<title>Nest Connect · concept</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    /* green-biased neutrals — light */
    --bg:#F5F8F6; --surface:#FFFFFF; --surface-2:#F3F6F4; --elevated:#FFFFFF;
    --border:#E4EBE7; --border-strong:#D3DDD8;
    --text:#0D1512; --text-muted:#586762; --text-faint:#8A968F;
    /* brand + accents */
    --brand:#0FA47A; --brand-strong:#0B7E5E; --brand-tint:#E4F5EE; --brand-ring:rgba(15,164,122,.35);
    --amber:#E68A00; --amber-tint:#FBEFD9;
    --danger:#E0544D; --danger-tint:#FBE7E5;
    /* channels */
    --wa:#1FBE5B; --email:#5B8DEF; --group:#A06CF2;
    --shadow:0 1px 2px rgba(13,21,18,.04),0 8px 24px -12px rgba(13,21,18,.14);
    --shadow-lg:0 24px 60px -20px rgba(13,21,18,.35);
    --r:12px; --r-sm:8px; --r-lg:18px;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#080D0B; --surface:#0E1512; --surface-2:#121A16; --elevated:#141D19;
      --border:#1E2925; --border-strong:#2A3832;
      --text:#E9F0EC; --text-muted:#93A29B; --text-faint:#697872;
      --brand:#28C795; --brand-strong:#1DA47A; --brand-tint:#0F241D; --brand-ring:rgba(40,199,149,.4);
      --amber:#F2A73C; --amber-tint:#2A2012;
      --danger:#F0716B; --danger-tint:#2B1615;
      --wa:#33D06B; --email:#78A0F5; --group:#B98BF6;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
      --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="light"]{
    --bg:#F5F8F6; --surface:#FFFFFF; --surface-2:#F3F6F4; --elevated:#FFFFFF;
    --border:#E4EBE7; --border-strong:#D3DDD8;
    --text:#0D1512; --text-muted:#586762; --text-faint:#8A968F;
    --brand:#0FA47A; --brand-strong:#0B7E5E; --brand-tint:#E4F5EE; --brand-ring:rgba(15,164,122,.35);
    --amber:#E68A00; --amber-tint:#FBEFD9; --danger:#E0544D; --danger-tint:#FBE7E5;
    --wa:#1FBE5B; --email:#5B8DEF; --group:#A06CF2;
    --shadow:0 1px 2px rgba(13,21,18,.04),0 8px 24px -12px rgba(13,21,18,.14);
    --shadow-lg:0 24px 60px -20px rgba(13,21,18,.35);
  }
  :root[data-theme="dark"]{
    --bg:#080D0B; --surface:#0E1512; --surface-2:#121A16; --elevated:#141D19;
    --border:#1E2925; --border-strong:#2A3832;
    --text:#E9F0EC; --text-muted:#93A29B; --text-faint:#697872;
    --brand:#28C795; --brand-strong:#1DA47A; --brand-tint:#0F241D; --brand-ring:rgba(40,199,149,.4);
    --amber:#F2A73C; --amber-tint:#2A2012; --danger:#F0716B; --danger-tint:#2B1615;
    --wa:#33D06B; --email:#78A0F5; --group:#B98BF6;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.7);
    --shadow-lg:0 30px 70px -20px rgba(0,0,0,.8);
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
    font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow:hidden}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  ::selection{background:var(--brand-ring)}
  .tnum{font-variant-numeric:tabular-nums}

  /* ---- stage / horizontal-scroll fallback ---- */
  .stage{height:100dvh;min-height:600px;overflow-x:auto;overflow-y:hidden;background:var(--bg)}
  .app{display:flex;height:100dvh;min-height:600px;min-width:1120px}

  /* ---- icon rail ---- */
  .rail{width:60px;flex:0 0 60px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:6px}
  .brandmark{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,var(--brand),var(--brand-strong));
    display:grid;place-items:center;color:#fff;box-shadow:0 6px 16px -6px var(--brand-ring);margin-bottom:10px}
  .brandmark svg{width:19px;height:19px}
  .railbtn{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;color:var(--text-muted);position:relative}
  .railbtn:hover{background:var(--surface-2);color:var(--text)}
  .railbtn.active{background:var(--brand-tint);color:var(--brand-strong)}
  .railbtn.active::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:3px;background:var(--brand)}
  .railbtn svg{width:20px;height:20px}
  .rail .spacer{flex:1}
  .avatar-me{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);
    color:#fff;display:grid;place-items:center;font-weight:650;font-size:12px;position:relative}
  .avatar-me .pres{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;background:var(--wa);border:2px solid var(--surface)}

  /* ---- sidebar (the signature) ---- */
  .side{width:264px;flex:0 0 264px;background:var(--surface);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0}
  .side__head{padding:16px 16px 10px;display:flex;align-items:center;gap:8px}
  .wordmark{font-size:19px;font-weight:750;letter-spacing:-.02em}
  .wordmark .dot{color:var(--brand)}
  .side__sub{font-size:11px;color:var(--text-faint);margin-left:auto;letter-spacing:.02em}
  .side__scroll{overflow-y:auto;padding:6px 10px 14px;flex:1;min-height:0}
  .sect-label{display:flex;align-items:center;gap:8px;padding:14px 8px 6px;
    font-size:11px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--text-faint)}
  .sect-label .line{flex:1;height:1px;background:var(--border)}
  .navrow{width:100%;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;
    color:var(--text-muted);text-align:left;position:relative}
  .navrow:hover{background:var(--surface-2);color:var(--text)}
  .navrow.active{background:var(--brand-tint);color:var(--brand-strong)}
  .navrow.active .navicon{color:var(--brand)}
  .navrow .navicon{width:18px;height:18px;flex:0 0 18px;display:grid;place-items:center;color:var(--text-faint)}
  .navrow .navicon svg{width:18px;height:18px}
  .navrow .lbl{font-weight:550;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navrow .cdot{width:9px;height:9px;border-radius:50%;flex:0 0 9px}
  .badge{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--surface-2);
    color:var(--text-muted);font-size:11px;font-weight:700;display:grid;place-items:center}
  .navrow.active .badge{background:#fff;color:var(--brand-strong)}
  :root[data-theme="dark"] .navrow.active .badge{background:var(--brand-strong);color:#fff}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .navrow.active .badge{background:var(--brand-strong);color:#fff}}
  .badge.on{background:var(--brand);color:#fff}
  .badge.warn{background:var(--amber);color:#fff}
  .sub{margin:2px 0 2px 30px;display:flex;flex-direction:column;gap:1px}
  .subrow{display:flex;align-items:center;gap:9px;padding:6px 10px;border-radius:8px;color:var(--text-muted);text-align:left;font-size:13px}
  .subrow:hover{background:var(--surface-2);color:var(--text)}
  .subrow.active{color:var(--text);font-weight:600}
  .subrow .mk{width:6px;height:6px;border-radius:50%;background:var(--border-strong);flex:0 0 6px}
  .subrow.active .mk{background:var(--brand)}
  .subrow .lbl{flex:1}
  .subrow .n{font-size:12px;color:var(--text-faint);font-weight:600}
  .newinbox{width:100%;margin-top:8px;display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;
    border:1px dashed var(--border-strong);color:var(--brand-strong);font-weight:600}
  .newinbox:hover{background:var(--brand-tint);border-color:var(--brand)}
  .newinbox svg{width:16px;height:16px}

  /* ---- conversation list ---- */
  .list{width:340px;flex:0 0 340px;background:var(--bg);border-right:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0}
  .list__head{padding:15px 16px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
  .list__title{display:flex;align-items:center;gap:9px}
  .list__title h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .list__title .badge{background:var(--brand-tint);color:var(--brand-strong)}
  .list__title .kbd{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-faint);
    border:1px solid var(--border);border-radius:6px;padding:3px 6px;display:flex;gap:3px;align-items:center}
  .list__title .kbd:hover{color:var(--text);border-color:var(--border-strong)}
  .search{margin-top:11px;display:flex;align-items:center;gap:8px;background:var(--surface-2);
    border:1px solid transparent;border-radius:10px;padding:8px 11px;color:var(--text-faint)}
  .search:focus-within{border-color:var(--brand);background:var(--surface)}
  .search svg{width:15px;height:15px}
  .search input{border:0;background:none;outline:none;color:var(--text);width:100%;font-size:13px}
  .chips{margin-top:11px;display:flex;gap:6px}
  .chip{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;color:var(--text-muted);background:var(--surface-2)}
  .chip.active{background:var(--text);color:var(--surface)}
  .chip:hover:not(.active){color:var(--text)}
  .convs{overflow-y:auto;flex:1;min-height:0}
  .conv{width:100%;display:grid;grid-template-columns:44px 1fr;gap:11px;padding:12px 15px;text-align:left;
    border-bottom:1px solid var(--border);position:relative}
  .conv:hover{background:var(--surface)}
  .conv.active{background:var(--surface)}
  .conv.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand)}
  .av{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:650;font-size:15px;position:relative}
  .av .ch{position:absolute;right:-2px;bottom:-2px;width:16px;height:16px;border-radius:50%;border:2.5px solid var(--bg);display:grid;place-items:center}
  .conv:hover .av .ch,.conv.active .av .ch{border-color:var(--surface)}
  .av .ch svg{width:9px;height:9px;color:#fff}
  .conv__main{min-width:0}
  .conv__top{display:flex;align-items:baseline;gap:8px}
  .conv__name{font-weight:650;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .conv__time{font-size:11px;color:var(--text-faint);flex:0 0 auto;font-variant-numeric:tabular-nums}
  .conv__prev{display:flex;align-items:center;gap:6px;margin-top:3px}
  .conv__prev p{margin:0;color:var(--text-muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
  .conv.unread .conv__name{font-weight:750}
  .conv.unread .conv__prev p{color:var(--text)}
  .conv__meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.02em}
  .tag.owner{background:var(--brand-tint);color:var(--brand-strong)}
  .tag.grab{background:var(--surface-2);color:var(--text-muted)}
  .sla{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--amber);font-variant-numeric:tabular-nums}
  .sla .d{width:6px;height:6px;border-radius:50%;background:var(--amber)}
  .typing{display:inline-flex;align-items:center;gap:3px;color:var(--brand);font-weight:600;font-size:12.5px}
  .typing i{width:5px;height:5px;border-radius:50%;background:currentColor;animation:blink 1.2s infinite ease-in-out}
  .typing i:nth-child(2){animation-delay:.18s}.typing i:nth-child(3){animation-delay:.36s}
  @keyframes blink{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-2px)}}

  /* ---- thread ---- */
  .thread{flex:1;min-width:420px;display:flex;flex-direction:column;background:var(--bg);min-height:0}
  .thread__head{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--surface);border-bottom:1px solid var(--border)}
  .thread__id{display:flex;align-items:center;gap:11px;min-width:0}
  .thread__id .who{min-width:0}
  .thread__id .who h2{margin:0;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .thread__id .who .sub{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--text-muted);margin-top:1px}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--text-muted)}
  .pill .d{width:7px;height:7px;border-radius:50%}
  .thread__actions{margin-left:auto;display:flex;align-items:center;gap:6px}
  .assignbtn{display:flex;align-items:center;gap:8px;background:var(--brand-tint);color:var(--brand-strong);
    font-weight:650;padding:7px 11px;border-radius:10px;font-size:13px}
  .assignbtn:hover{background:var(--brand);color:#fff}
  .assignbtn .mini{width:20px;height:20px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700}
  .assignbtn svg{width:14px;height:14px}
  .iconbtn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-muted)}
  .iconbtn:hover{background:var(--surface-2);color:var(--text)}
  .iconbtn svg{width:18px;height:18px}
  .iconbtn.on{background:var(--brand-tint);color:var(--brand-strong)}

  .msgs{flex:1;overflow-y:auto;padding:20px 8%;display:flex;flex-direction:column;gap:10px;min-height:0}
  .daysep{align-self:center;font-size:11px;font-weight:650;color:var(--text-muted);background:var(--surface);
    border:1px solid var(--border);padding:4px 12px;border-radius:999px;margin:6px 0}
  .msg{max-width:74%;display:flex;flex-direction:column;gap:2px}
  .msg .bubble{padding:9px 13px;border-radius:16px;font-size:14px;box-shadow:var(--shadow)}
  .msg.in{align-self:flex-start}
  .msg.in .bubble{background:var(--surface);border-top-left-radius:5px}
  .msg.out{align-self:flex-end;align-items:flex-end}
  .msg.out .bubble{background:var(--brand);color:#fff;border-top-right-radius:5px}
  :root[data-theme="dark"] .msg.out .bubble{color:#04120d}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .msg.out .bubble{color:#04120d}}
  .msg .meta{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text-faint);padding:0 4px;font-variant-numeric:tabular-nums}
  .msg.out .meta .tick{color:var(--email)}
  .msg .sender{font-size:11px;font-weight:700;color:var(--brand-strong);padding:0 4px 1px}

  .note{align-self:center;width:100%;max-width:86%;background:var(--amber-tint);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);
    border-radius:12px;padding:10px 13px;display:flex;gap:10px}
  .note .ic{width:26px;height:26px;border-radius:8px;background:var(--amber);color:#fff;display:grid;place-items:center;flex:0 0 26px}
  .note .ic svg{width:15px;height:15px}
  .note .body{min-width:0;font-size:13px}
  .note .body .h{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px}
  .note .body .h .t{margin-left:auto;color:var(--text-faint);text-transform:none;letter-spacing:0;font-weight:600}
  .note .body .men{color:var(--brand-strong);font-weight:700}

  /* composer */
  .composer{padding:12px 18px 16px;background:var(--surface);border-top:1px solid var(--border)}
  .compbar{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .winhint{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;color:var(--brand-strong);
    background:var(--brand-tint);padding:4px 9px;border-radius:999px}
  .winhint .d{width:7px;height:7px;border-radius:50%;background:var(--wa)}
  .chsel{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:650;color:var(--text-muted);margin-left:auto;padding:4px 9px;border-radius:999px}
  .chsel:hover{background:var(--surface-2);color:var(--text)}
  .chsel .d{width:8px;height:8px;border-radius:50%}
  .compinput{display:flex;align-items:flex-end;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:16px;padding:6px 6px 6px 14px}
  .compinput:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-ring)}
  .compinput .ta{flex:1;min-height:24px;padding:6px 0;color:var(--text);outline:none;font-size:14px}
  .compinput .ta:empty::before{content:attr(data-ph);color:var(--text-faint)}
  .compinput .tool{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--text-muted);flex:0 0 34px}
  .compinput .tool:hover{background:var(--border);color:var(--text)}
  .compinput .tool svg{width:18px;height:18px}
  .send{width:38px;height:38px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;flex:0 0 38px}
  .send:hover{background:var(--brand-strong)}
  .send svg{width:18px;height:18px}

  /* ---- context panel ---- */
  .panel{width:288px;flex:0 0 288px;background:var(--surface);border-left:1px solid var(--border);
    display:flex;flex-direction:column;min-height:0}
  .panel__scroll{overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:18px}
  .cust{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
  .cust .big{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:24px;margin-bottom:6px}
  .cust h3{margin:0;font-size:16px;font-weight:750}
  .cust .co{font-size:12.5px;color:var(--text-muted)}
  .cust .quick{display:flex;gap:8px;margin-top:10px}
  .cust .quick button{width:38px;height:38px;border-radius:11px;background:var(--surface-2);color:var(--text-muted);display:grid;place-items:center}
  .cust .quick button:hover{background:var(--brand-tint);color:var(--brand-strong)}
  .cust .quick svg{width:17px;height:17px}
  .block{border-top:1px solid var(--border);padding-top:16px;display:flex;flex-direction:column;gap:10px}
  .block > .t{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--text-faint)}
  .kv{display:flex;align-items:center;gap:10px}
  .kv .k{font-size:12.5px;color:var(--text-muted);width:74px;flex:0 0 74px}
  .kv .v{font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
  .prio{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:7px;background:var(--danger-tint);color:var(--danger)}
  .slabox{background:var(--amber-tint);border-radius:10px;padding:11px 12px;display:flex;align-items:center;gap:10px}
  .slabox .ring{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--amber) 68%,color-mix(in srgb,var(--amber) 22%,transparent) 0);color:var(--amber);font-weight:800;flex:0 0 34px}
  .slabox .ring b{background:var(--amber-tint);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px}
  .slabox .txt small{display:block;font-size:11px;color:var(--text-muted);font-weight:600}
  .slabox .txt .cd{font-size:15px;font-weight:800;color:var(--amber);font-variant-numeric:tabular-nums}
  .lbls{display:flex;flex-wrap:wrap;gap:6px}
  .lbl-chip{font-size:11.5px;font-weight:650;padding:4px 9px;border-radius:7px;background:var(--surface-2);color:var(--text-muted);display:inline-flex;align-items:center;gap:6px}
  .lbl-chip .d{width:7px;height:7px;border-radius:50%}
  .xthread{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--surface-2)}
  .xthread:hover{background:var(--brand-tint)}
  .xthread .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;flex:0 0 28px}
  .xthread .ic svg{width:15px;height:15px}
  .xthread .m{flex:1;min-width:0}
  .xthread .m b{font-size:12.5px;font-weight:650;display:block}
  .xthread .m small{font-size:11.5px;color:var(--text-muted)}
  .xthread .n{font-size:11px;font-weight:700;color:var(--text-faint)}

  /* ---- command palette ---- */

      var e=el("div","msg "+side);
      var inner="";
      if(x.s&&!x.out)inner+='<div class="sender">'+x.s+'</div>';
      inner+='<div class="bubble">'+x.b+'</div>';
      if(x.t)inner+='<div class="meta">'+x.t+(x.tick?' <span class="tick">'+x.tick+'</span>':'')+'</div>';
      e.innerHTML=inner; m.appendChild(e);
    });
    m.scrollTop=m.scrollHeight;
    renderPanel(c);
  }

  /* ---------- context panel ---------- */
  function renderPanel(c){
    var labels=c.labels.map(function(l){return '<span class="lbl-chip"><span class="d" style="background:'+l[1]+'"></span>'+l[0]+'</span>'}).join("")||'<span style="color:var(--text-faint);font-size:12.5px">No labels</span>';
    var others=[["wa","WhatsApp","3 messages"],["email","Email","1 thread"],["group","Group space","live"]]
      .filter(function(o){return o[0]!==c.ch})
      .map(function(o){return '<button class="xthread"><div class="ic" style="background:'+CH[o[0]].c+'">'+CH[o[0]].ic+'</div><div class="m"><b>'+o[1]+'</b><small>'+o[2]+'</small></div><span class="n">›</span></button>'}).join("");
    $("#panelScroll").innerHTML=
      '<div class="cust">'+
        '<div class="big" style="background:'+c.grad+'">'+c.av+'</div>'+
        '<h3>'+c.name+'</h3><div class="co">'+c.co+'</div>'+
        '<div class="quick">'+
          '<button title="Call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5c0 8 7 15 15 15l-1.5-4-4-1-2 2c-2.5-1.3-4.7-3.5-6-6l2-2-1-4L4 5Z"/></svg></button>'+
          '<button title="Email"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></button>'+
          '<button title="Profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg></button>'+
        '</div>'+
      '</div>'+
      '<div class="block"><div class="t">Assignment</div>'+
        '<div class="kv"><span class="k">Assignee</span><span class="v"><span class="mini" style="width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,#3B82F6,#8B5CF6);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:700">NA</span> You</span></div>'+
        '<div class="kv"><span class="k">Team</span><span class="v">'+ (c.state==="mine"?"Support":"Support · up for grabs") +'</span></div>'+
        '<div class="kv"><span class="k">Priority</span><span class="v"><span class="prio">'+c.prio+'</span></span></div>'+
      '</div>'+
      (c.sla&&c.sla!=="—"?
      '<div class="block"><div class="t">SLA</div>'+
        '<div class="slabox"><div class="ring"><b id="slaRing">68%</b></div><div class="txt"><small>First response due in</small><span class="cd" id="slaCd">'+c.sla+'</span></div></div>'+
      '</div>':"")+
      '<div class="block"><div class="t">Labels</div><div class="lbls">'+labels+'</div></div>'+
      '<div class="block"><div class="t">Contact</div>'+
        '<div class="kv"><span class="k">Phone</span><span class="v">'+c.phone+'</span></div>'+
        '<div class="kv"><span class="k">Email</span><span class="v" style="font-weight:550;font-size:12.5px">'+c.email+'</span></div>'+
      '</div>'+
      '<div class="block"><div class="t">Across channels</div>'+others+'</div>';
  }

  /* ---------- sidebar nav ---------- */
  document.querySelectorAll(".navrow[data-view]").forEach(function(n){
    n.addEventListener("click",function(){
      document.querySelectorAll(".navrow").forEach(function(x){x.classList.remove("active")});
      document.querySelectorAll(".subrow").forEach(function(x){x.classList.remove("active")});
      n.classList.add("active"); renderList(n.getAttribute("data-view"));
    });
  });
  document.querySelectorAll(".subrow[data-view]").forEach(function(n){
    n.addEventListener("click",function(){
      document.querySelectorAll(".subrow").forEach(function(x){x.classList.remove("active")});
      document.querySelectorAll(".navrow").forEach(function(x){x.classList.remove("active")});
      $('.navrow[data-view="inbound"]').classList.add("active");
      n.classList.add("active"); renderList(n.getAttribute("data-view"));
    });
  });

  /* ---------- details toggle ---------- */
  $("#detailsBtn").addEventListener("click",function(){
    var p=$("#panel"); var vis=p.style.display!=="none"&&getComputedStyle(p).display!=="none";
    p.style.display=vis?"none":"flex"; this.classList.toggle("on",!vis);
  });

  /* ---------- composer ---------- */
  function toast(msg){var t=$("#toast");$("#toastMsg").textContent=msg;t.classList.add("show");clearTimeout(t._h);t._h=setTimeout(function(){t.classList.remove("show")},1900);}
  function send(){
    var ta=$(".compinput .ta"); var txt=(ta.textContent||"").trim(); if(!txt)return;
    var m=$("#msgs"); var e=el("div","msg out");
    e.innerHTML='<div class="bubble">'+txt.replace(/</g,"&lt;")+'</div><div class="meta">now <span class="tick" style="color:var(--text-faint)">✓</span></div>';
    m.appendChild(e); ta.textContent=""; m.scrollTop=m.scrollHeight;
    setTimeout(function(){var tk=e.querySelector(".tick");if(tk){tk.textContent="✓✓";tk.style.color="var(--email)";}},1400);
  }
  $("#sendBtn").addEventListener("click",send);
  $(".compinput .ta").addEventListener("keydown",function(ev){if(ev.key==="Enter"&&!ev.shiftKey){ev.preventDefault();send();}});
  $("#assignBtn").addEventListener("click",function(){toast("Opened assignment — route to a team or agent")});
  $("#newinbox").addEventListener("click",function(){toast("Connect a WhatsApp number, group or email — then pick a team")});
  $("#chsel").addEventListener("click",function(){toast("Switch channel for this reply")});

  /* ---------- command palette ---------- */
  var CMDS=[
    {g:"Route & assign",items:[
      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/></svg>',l:"Assign to me",s:"Take this conversation",k:"A",fn:function(){toast("Assigned to you")}},
      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>',l:"Route to another team…",s:"Support · Sales · Finance",k:"R",fn:function(){toast("Routed to Sales team")}},
      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/></svg>',l:"Snooze until…",s:"Tomorrow 9am · Custom",k:"S",fn:function(){toast("Snoozed until tomorrow 9:00")}}
    ]},
    {g:"Jump to",items:[
      {ic:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.5 15.3L2 22l4.9-1.4A10 10 0 1 0 12 2Z"/></svg>',l:"The Ivy House · group",s:"WhatsApp group · Priya",fn:function(){openConv("ivy")}},
      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',l:"Tide & Co.",s:"Email · onboarding",fn:function(){openConv("tide")}}
    ]},
    {g:"Create",items:[
      {ic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>',l:"New inbox & route",s:"Connect WhatsApp, group or email",fn:function(){toast("New inbox flow")}}
    ]}
  ];
  var cmdk=$("#cmdk"),cmdkList=$("#cmdkList"),cmdkInput=$("#cmdkInput");
  function drawCmd(filter){
    cmdkList.innerHTML=""; filter=(filter||"").toLowerCase(); var first=true;
    CMDS.forEach(function(grp){
      var matches=grp.items.filter(function(it){return (it.l+" "+it.s).toLowerCase().indexOf(filter)>-1});
      if(!matches.length)return;
      cmdkList.appendChild(el("div","cmdk__grp",grp.g));
      matches.forEach(function(it){
        var b=el("button","cmditem"+(first?" sel":""));first=false;
        b.innerHTML='<span class="ic">'+it.ic+'</span><span class="lbl">'+it.l+(it.s?'<small>'+it.s+'</small>':'')+'</span>'+(it.k?'<span class="k">'+it.k+'</span>':'');
        b.addEventListener("click",function(){closeCmd();it.fn&&it.fn();});
        cmdkList.appendChild(b);
      });
    });
  }
  function openCmd(){cmdk.classList.add("open");cmdkInput.value="";drawCmd("");setTimeout(function(){cmdkInput.focus()},20);}
  function closeCmd(){cmdk.classList.remove("open");}
  cmdkInput&&cmdkInput.addEventListener("input",function(){drawCmd(this.value)});
  $("#kbdhint").addEventListener("click",openCmd);
  cmdk.addEventListener("click",function(e){if(e.target===cmdk)closeCmd()});
  document.addEventListener("keydown",function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();cmdk.classList.contains("open")?closeCmd():openCmd();}
    if(e.key==="Escape")closeCmd();
    if(cmdk.classList.contains("open")&&e.key==="Enter"){var s=$(".cmditem.sel");s&&s.click();}
  });

  /* ---------- live SLA countdown ---------- */
  var slaEnd=Date.now()+ (72*60+ 12)*1000; // ~1h12m in "fast" demo seconds
  setInterval(function(){
    var cd=$("#slaCd"); if(!cd)return;
    var left=Math.max(0,slaEnd-Date.now());
    var totalSec=Math.floor(left/1000), h=Math.floor(totalSec/3600), m=Math.floor((totalSec%3600)/60), s=totalSec%60;
    cd.textContent=(h>0?h+"h ":"")+m+"m "+(s<10?"0":"")+s+"s";
  },1000);

  /* ---------- boot ---------- */
  renderList("mine");
  openConv("ivy");
})();
</script>
