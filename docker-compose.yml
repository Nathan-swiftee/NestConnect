# Local infrastructure for Ding development.
#   pnpm db:up     # start Postgres + Redis
#   pnpm db:migrate && pnpm db:seed
#   pnpm db:down   # stop
services:
  postgres:
    image: postgres:16-alpine
    container_name: ding-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ding
      POSTGRES_PASSWORD: ding
      POSTGRES_DB: ding
    ports:
      - "5432:5432"
    volumes:
      - ding_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ding"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ding-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ding_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ding_pgdata:
  ding_redisdata:
