name: Mobile build

# A native BUILD is deliberately manual: it takes ~15–25 minutes of EAS queue and
# burns a build credit, so it should happen when someone wants an installable app
# — not on every push. Trigger it from the repo's Actions tab (github.com works
# fine from a phone browser); the run's summary links to the build page, where
# the QR code and install link appear.
#
# An UPDATE is not that. It is seconds of work, costs nothing, and reaches phones
# that already have the app — so it runs on every push that touches the JS the
# app actually ships. It was manual only because it shares a workflow with the
# build, and the cost argument for one got applied to the other: what that meant
# in practice is that a mobile fix could be committed, reviewed, deployed to the
# web and reported as done while the phone in someone's hand still ran the old
# code, with nothing anywhere saying so.
#
# Requires one repository secret, EXPO_TOKEN — see docs/08-mobile-builds.md.
on:
  push:
    branches: ["**"]
    paths:
      # What Metro bundles. A change outside these can't alter the app's JS, and
      # publishing an identical update just to say we did adds a row to the
      # updates list that means nothing.
      - "apps/mobile/**"
      - "packages/schemas/**"
      - "packages/client/**"
      - "packages/design/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "build = a new installable app. update = push JS-only changes to apps already installed (seconds, no rebuild)."
        type: choice
        options: [build, update]
        default: build
      platform:
        description: "Which app to build. Ignored for update — an update reaches both."
        type: choice
        options: [android, ios, all]
        default: android
      profile:
        description: "preview = internal install (Android APK). production = store build."
        type: choice
        options: [preview, production]
        default: preview
      message:
        description: "Note shown against the build/update on expo.dev. Defaults to the commit subject."
        type: string
        required: false

concurrency:
  # One at a time per ref: two builds of the same commit is a wasted credit, and
  # two updates racing onto one channel is a coin flip over which lands last.
  group: mobile-${{ github.ref }}
  cancel-in-progress: false

# A push publishes an update to the preview channel; a dispatch does whatever it
# was asked to. Read once here so every step below agrees on which it is.
env:
  MOBILE_MODE: ${{ github.event_name == 'push' && 'update' || inputs.mode }}
  MOBILE_PROFILE: ${{ github.event_name == 'push' && 'preview' || inputs.profile }}

jobs:
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` — pnpm/action-setup reads it from "packageManager" in
      # package.json, and pinning it in both places aborts the action
      # (ERR_PNPM_BAD_PM_VERSION). Same as ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Installed from the ROOT: apps/mobile depends on @ding/client and
      # @ding/schemas, and node-linker=hoisted puts their files in the root
      # node_modules rather than under apps/mobile.
      - name: Install
        run: pnpm install --frozen-lockfile

      # Catches a resolution break before spending 20 minutes of EAS queue on it.
      # Metro resolves differently from tsc, so a typecheck alone wouldn't.
      - name: Bundle check
        working-directory: apps/mobile
        run: pnpm exec expo export --platform ios --output-dir /tmp/mobile-bundle

      # `head_commit` only exists on push events, so read the subject from git.
      - name: Resolve the message
        id: msg
        run: |
          MSG="${{ inputs.message }}"
          [ -n "$MSG" ] || MSG="$(git log -1 --pretty=%s)"
          echo "text=$MSG" >> "$GITHUB_OUTPUT"

      - name: Build
        if: env.MOBILE_MODE == 'build'
        working-directory: apps/mobile
        # No `--no-wait`, deliberately, and it used to be there. The argument for
        # it was that the runner shouldn't idle through the queue for a progress
        # bar the build page already shows — which assumed someone is watching
        # that page. Nobody is. What actually happened is that EAS accepted a job,
        # failed it twenty minutes later, and this workflow stayed green: a run
        # that reports success whether or not an app exists at the end of it is
        # worse than no signal, because it's a signal people believe. Waiting
        # costs runner minutes and turns a failed build red, which is the whole
        # reason to have this.
        #
        # The build page URL is printed near the start of the command's output,
        # so it's available in the log long before the run finishes.
        timeout-minutes: 60
        run: |
          pnpm exec eas build \
            --platform ${{ inputs.platform }} \
            --profile ${{ env.MOBILE_PROFILE }} \
            --message "${{ steps.msg.outputs.text }}" \
            --non-interactive

      - name: Update
        if: env.MOBILE_MODE == 'update'
        working-directory: apps/mobile
        run: |
          # The channel matches the build profile's `channel` in eas.json, so an
          # update published here reaches the builds made with that profile.
          pnpm exec eas update \
            --channel ${{ env.MOBILE_PROFILE }} \
            --message "${{ steps.msg.outputs.text }}" \
            --non-interactive

      - name: Where to find it
        run: |
          KIND="${{ env.MOBILE_MODE == 'build' && 'builds' || 'updates' }}"
          {
            echo "### Mobile ${{ env.MOBILE_MODE }} started"
            echo
            echo "Watch it — and get the install link / QR code — at:"
            echo
            echo "<https://expo.dev/accounts/swiftee/projects/nest-connect/$KIND>"
            echo
            if [ "$KIND" = "updates" ]; then
              echo "It reaches an installed app the next time that app is opened."
              echo "A native build only picks up updates published for its own"
              echo "runtime version, so if this one doesn't appear, the app in"
              echo "your hand needs rebuilding rather than updating."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
