name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — pnpm/action-setup reads it from the "packageManager"
      # field in package.json. Pinning it in both places makes the action abort
      # with ERR_PNPM_BAD_PM_VERSION ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Where an inbound message lands. This shipped wrong — a reply to a snoozed
      # chat opened a second conversation with the same customer — and nothing
      # else here would have noticed: it typechecks, it builds, no request fails,
      # and the duplicate looks like a customer starting a new conversation.
      - name: Inbound threading rule
        run: pnpm check:threading

      # Which team a new conversation lands on. Sibling to the rule above and
      # failing the same way: a chat routed to the wrong people looks completely
      # normal — it typechecks, it builds, nothing errors — it is simply sitting
      # in front of a team that isn't going to answer it, while the customer
      # waits. The check has existed since the routing menu shipped and was only
      # ever run by hand, which protects nobody.
      - name: Routing rule
        run: pnpm check:routing

      # Hooks called below an early return. React throws #310 and unmounts the
      # whole tree, so the symptom is a white page with nothing in the console
      # that names the component — and it typechecks and builds perfectly. It has
      # shipped twice, most recently blanking the web app the moment you signed in.
      - name: Hook order
        run: pnpm check:hooks

      # Reading a customer list someone exported. Both halves fail silently
      # rather than loudly: a naive CSV split puts half an address in the name
      # field, and a first-match header scan reads "Company Name" as the
      # customer's name and imports everyone under their employer.
      - name: Web unit tests
        run: pnpm --filter @ding/web test

      # Three structural rules about the mobile screens that neither the
      # typechecker nor a browser can see. Takes a second. docs/11-mobile-layout.md
      # says why they exist and why they aren't rendering tests.
      - name: Mobile layout rules
        run: pnpm --filter @ding/mobile check:layout

      # The measurement the third of those rules rests on: on this stack an
      # animated style displaces every other style on its element. If an interop
      # release ever fixes that, this is what says so.
      - name: Mobile native-render tests
        run: pnpm --filter @ding/mobile test

      # The shared client runs in two runtimes and must not guess which. One
      # `typeof document` in here took out every upload on the phone while
      # passing every check, because the checks all run in a browser.
      - name: Shared client runtime sniffing
        run: pnpm --filter @ding/client check:no-sniffing

      # Typecheck can't see a native-only resolution break (a package Metro
      # resolves differently, a config plugin that won't load). Bundling for one
      # platform does, and takes about half a minute.
      - name: Bundle the mobile app
        run: pnpm --filter @ding/mobile exec expo export --platform ios --output-dir /tmp/mobile-bundle
