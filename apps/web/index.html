<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the mobile browser's top/bottom chrome to match the app surface
         (kept in sync with the theme by syncThemeColor()). -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- There was no site icon at all before this, so every tab showed the
         browser's blank page glyph. SVG first for anything modern — it stays
         sharp at whatever size the browser asks for, including the 16px
         favourites bar — with a PNG behind it for the ones that don't take SVG,
         and a 180 for an iOS home screen, which composites onto white and so
         needs the mark on its own tile rather than floating. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <title>Nest Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
