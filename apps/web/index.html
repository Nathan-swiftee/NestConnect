<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Colours the mobile browser's top/bottom chrome to match the app surface
         (kept in sync with the theme by syncThemeColor()). -->
    <meta name="theme-color" content="#FFFFFF" />
    <!-- There was no site icon at all before this, so every tab showed the
         browser's blank page glyph. Three sizes, all
         cut from the delivered artwork by tools/render-logo.mjs: a 32 for the
         tab, a 64 for denser displays, and a 180 for an iOS home screen — which
         composites onto white, so that one is the mark on its own navy tile
         rather than floating. -->
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="icon" href="/favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />
    <title>Nest Connect</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
